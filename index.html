<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Dinheiro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Meu Dinheiro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f4f6f5; --card:#fff; --ink:#14201d; --muted:#61706c; --line:#e3e8e6;
  --brand:#0f766e; --brand-soft:#d9f0ec; --good:#15803d; --good-soft:#dcfce7;
  --warn:#b45309; --warn-soft:#fef3c7; --bad:#b91c1c; --bad-soft:#fee2e2;
  --info:#1d4ed8; --info-soft:#dbeafe; --radius:18px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1412;--card:#16201d;--ink:#e8efec;--muted:#93a39e;--line:#26332f;
  --brand:#2dd4bf;--brand-soft:#123b36;--good:#4ade80;--good-soft:#14321f;--warn:#fbbf24;--warn-soft:#3a2d0e;
  --bad:#f87171;--bad-soft:#3b1515;--info:#93c5fd;--info-soft:#172a4a}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:calc(var(--safe-t) + 8px) 0 calc(84px + var(--safe-b))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
main{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:22px;margin:8px 0 14px}
h2{font-size:15px;margin:22px 4px 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.monthbar button{width:40px;height:40px;border-radius:12px;background:var(--card);font-size:20px}
.monthbar strong{font-size:17px}
.hero{background:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.hero{color:#06201c}}
.hero .lbl{opacity:.85;font-size:14px}
.hero .big{font-size:34px;font-weight:750;margin:2px 0 12px;letter-spacing:-.02em}
.hero .split{display:flex;gap:10px}
.hero .split div{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px}
.hero .split b{display:block;font-size:16px}
.daily{display:flex;align-items:center;gap:14px}
.daily .ico{width:46px;height:46px;border-radius:14px;background:var(--brand-soft);display:grid;place-items:center;font-size:22px;flex:none}
.daily .v{font-size:24px;font-weight:750}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--good)}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.cat{padding:12px 0;border-bottom:1px solid var(--line)} .cat:last-child{border-bottom:0}
.cat .em{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--bg);font-size:18px;flex:none}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.info{background:var(--info-soft);color:var(--info)}
.ins{display:flex;gap:12px;padding:14px;border-radius:16px;margin-bottom:10px;background:var(--card);border-left:5px solid var(--info)}
.ins.good{border-color:var(--good)} .ins.warn{border-color:var(--warn)} .ins.bad{border-color:var(--bad)}
.ins .t{font-weight:650;margin-bottom:2px} .ins .x{font-size:14px;color:var(--muted)}
.ins .n{font-size:20px;flex:none}
.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)} .step:last-child{border-bottom:0}
.step .k{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
@media (prefers-color-scheme:dark){.step .k{color:#06201c}}
.step .t{font-weight:600}
.tx{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.tx:last-child{border-bottom:0}
.tx .v{font-weight:650} .in{color:var(--good)} .out{color:var(--ink)}
.day{font-size:13px;color:var(--muted);margin:14px 4px 4px;font-weight:600}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.in-f{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none}
.in-f:focus{border-color:var(--brand)}
.money{font-size:30px;font-weight:750;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:650}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;font-size:16px;margin-top:18px}
@media (prefers-color-scheme:dark){.btn{color:#06201c}}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.bud{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.bud:last-child{border-bottom:0}
.bud input{width:120px;text-align:right;padding:9px 10px}
.bud2{padding:10px 0;border-bottom:1px solid var(--line)} .bud2:last-of-type{border-bottom:0}
.bud2 .x{width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:18px;flex:none}
.pair{display:flex;align-items:center;gap:6px;margin-top:8px;padding-left:30px}
.pair input{padding:9px 10px;text-align:right}
.pair input:first-child{width:64px} .pair input:last-child{width:110px}
.bud .x{width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:18px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 6px calc(6px + var(--safe-b));z-index:10}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0}
nav.tabs button span{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--brand);font-weight:700}
nav.tabs .fab{flex:none;width:58px;height:58px;margin-top:-26px;border-radius:50%;background:var(--brand);color:#fff;font-size:30px;
  box-shadow:0 6px 18px rgba(15,118,110,.35);justify-content:center}
@media (prefers-color-scheme:dark){nav.tabs .fab{color:#06201c}}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;
  padding:10px 18px calc(18px + var(--safe-b));max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .22s ease;max-width:560px;margin:0 auto}
.sheet.open{transform:none} .sheet-bg.open{display:block}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis .card{margin:0}
.kpis b{display:block;font-size:19px;margin-top:2px}
.onb{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.onb .logo{font-size:44px}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
